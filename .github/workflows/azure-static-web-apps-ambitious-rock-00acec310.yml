name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild the calendar feeds every 6 hours
    - cron: "0 */6 * * *"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Copy page template for share previews
        run: cp index.html api/share/template.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build calendar feeds
        # Static .ics files per park, generated here and deployed with the site (never committed).
        # Past weeks are carried over from the live feeds. A failed weather fetch keeps the old events.
        continue-on-error: true
        env:
          TZ: America/Toronto
        run: node scripts/build-calendars.cjs
      - name: Build city pages and sitemap
        # Static /skateparks/ pages with this week's forecast baked in, plus sitemap.xml (never committed).
        # Reuses the forecasts fetched for the calendar feeds. Without weather, pages build without the forecast.
        continue-on-error: true
        env:
          TZ: America/Toronto
        run: node scripts/build-pages.cjs
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_ROCK_00ACEC310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_ROCK_00ACEC310 }}
          action: "close"
