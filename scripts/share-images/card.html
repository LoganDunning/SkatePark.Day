<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0B0B0C;color:#F1F0EC;font-family:'Space Grotesk',system-ui,sans-serif}
.card{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;isolation:isolate}
.card::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,11,12,.95) 0%,rgba(11,11,12,.82) 48%,rgba(11,11,12,.45) 100%),url('../../img/hero-skatepark.jpg') center 40%/cover no-repeat;filter:grayscale(1)}
.card::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:#F1F0EC}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{width:56px;height:42px}
.brand span{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:#98968E}
.brand b{color:#F1F0EC}
.kicker{margin-top:auto;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#98968E}
h1{margin-top:18px;font-size:124px;line-height:.98;font-weight:600;letter-spacing:-.035em}
h1 .m{color:#98968E;font-weight:300}
.sub{margin-top:24px;font-size:30px;font-weight:300;color:#C9C7BF;max-width:740px}
.ramp{position:absolute;right:72px;top:58px;width:220px;color:#F1F0EC;opacity:.9}
.url{position:absolute;right:72px;bottom:50px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:22px;letter-spacing:.08em;color:#F1F0EC}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><svg viewBox="0 0 42 32"><g fill="none"><path stroke="currentColor" stroke-width="1.9" d="M4 3v26h8.5a6.75 6.75 0 0 0 0-13.5H4M4 3h7.5a6.25 6.25 0 0 1 0 12.5"/><path stroke="currentColor" stroke-width="1.1" opacity=".62" d="M23 3v19M23 3h3a13 13 0 0 1 0 26h-1.5"/></g></svg><span><b>Best</b> SkatePark Day</span></div>
  <svg class="ramp" viewBox="0 0 200 120" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M10 104h44c22 0 30-30 46-30s24 30 46 30h44"/><g transform="translate(72 66) rotate(-26)"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M2 4c2 4 5 6 10 6h32c5 0 8-2 10-6"/><circle cx="16" cy="16" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="16" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/></g></svg>
  <p class="kicker" id="kicker"></p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="url">best.skatepark.day</div>
</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('kicker').textContent=q.get('kicker')||'';
document.getElementById('title').innerHTML=q.get('title')||'';
document.getElementById('sub').textContent=q.get('sub')||'';
if(q.get('nourl'))document.querySelector('.url').remove();
</script>
</body>
</html>
